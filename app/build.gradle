plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.androidx.baselineprofile)
}

android {
    namespace 'com.socialapp'
    compileSdk 36
    if (providers.gradleProperty("benchmarkReplayFeedback").orNull == "true") {
        testBuildType "benchmarkRelease"
    }

    defaultConfig {
        applicationId "com.socialapp"
        minSdk 24
        //noinspection ExpiredTargetSdkVersion
        targetSdk 36
        versionCode 1
        versionName "1.0"
        buildConfigField "boolean", "PROFILE_FIXTURES", "false"
        buildConfigField "String", "BASE_URL", '"https://socialappbe-8tjc.onrender.com"'
        buildConfigField "String", "FACTCHECK_BASE_URL", '"https://kiendao744-backend-ooc.hf.space/api/v1/"'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        benchmark {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // Separate device data and signing from the normal app.
        nonMinifiedRelease {
            applicationIdSuffix ".profile"
            signingConfig signingConfigs.debug
        }
        benchmarkRelease {
            applicationIdSuffix ".profile"
            signingConfig signingConfigs.debug
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        if (variant.buildType in ["nonMinifiedRelease", "benchmarkRelease"]) {
            variant.buildConfigFields.put("PROFILE_FIXTURES",
                    new com.android.build.api.variant.BuildConfigField("boolean", "true", null))
        }
    }
}

baselineProfile {
    automaticGenerationDuringBuild = false
    dexLayoutOptimization = true
}

// AGP 8.9.1 wires the merged Startup Profile into D8 for non-debuggable builds.
// Isolate the control at that input so ART Baseline Profile compilation stays enabled.
if (providers.gradleProperty("benchmarkStartupProfile").orElse("true").get() == "false") {
    afterEvaluate {
        tasks.named("mergeDexBenchmarkRelease").configure { task ->
            task.inputProfileForDexStartupOptimization.set((org.gradle.api.file.RegularFile) null)
        }
    }
}

dependencies {
    baselineProfile project(':baselineprofile')
    implementation libs.profileinstaller

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.swiperefreshlayout
    implementation libs.browser

    // CameraX
    implementation libs.camera.core
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view

    // Retrofit & OkHttp
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.okhttp
    implementation libs.ucrop

    // Glide
    implementation libs.glide
    annotationProcessor libs.glide.compiler

    // Navigation
    implementation libs.navigation.fragment
    implementation libs.navigation.ui

    testImplementation libs.junit
    testImplementation libs.mockwebserver
    testImplementation libs.core.testing
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
