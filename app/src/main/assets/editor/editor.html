<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rich Text Editor</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, Roboto, sans-serif; margin: 0; padding: 12px; color: #212121; background-color: #ffffff; }
        #toolbar { position: sticky; top: -12px; z-index: 1000; background: #ffffff; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0; border-bottom: 1px solid #e0e0e0; margin-bottom: 12px; }
        .btn { background: #f5f5f5; border: 1px solid #cccccc; border-radius: 4px; padding: 6px 10px; font-size: 13px; font-weight: bold; color: #333333; cursor: pointer; }
        .btn:active { background: #e0e0e0; }
        #editor { min-height: 250px; outline: none; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; font-size: 15px; line-height: 1.6; }
        #editor:empty:before { content: "Nhập nội dung bài viết chi tiết tại đây..."; color: #9e9e9e; }
        img { max-width: 100% !important; height: auto !important; border-radius: 8px; display: block; margin: 10px 0; }
        blockquote { border-left: 4px solid #1976D2; margin: 10px 0; padding-left: 12px; color: #555555; font-style: italic; }
        pre, code { background: #f0f0f0; padding: 8px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <div id="toolbar">
        <button class="btn" onclick="execCmd('bold')"><b>B</b></button>
        <button class="btn" onclick="execCmd('italic')"><i>I</i></button>
        <button class="btn" onclick="execCmd('underline')"><u>U</u></button>
        <button class="btn" onclick="execCmd('formatBlock', '<h2>')">H2</button>
        <button class="btn" onclick="execCmd('formatBlock', '<h3>')">H3</button>
        <button class="btn" onclick="execCmd('insertUnorderedList')">• Danh sách</button>
        <button class="btn" onclick="execCmd('formatBlock', '<blockquote>')">” Trích dẫn</button>
        <button class="btn" onclick="insertLink()">🔗 Link</button>
        <button class="btn" onclick="triggerImageUpload()" style="background:#1976D2; color:#ffffff; border-color:#1976D2;">📷 Chèn ảnh</button>
    </div>

    <div id="editor" contenteditable="true"></div>

    <script>
        function execCmd(cmd, value = null) {
            document.execCommand(cmd, false, value);
        }

        function insertLink() {
            var url = prompt("Nhập liên kết (URL):", "https://");
            if (url) {
                execCmd("createLink", url);
            }
        }

        function triggerImageUpload() {
            if (window.AndroidBridge && window.AndroidBridge.pickImage) {
                window.AndroidBridge.pickImage();
            }
        }

        function insertImage(imageUrl) {
            document.getElementById("editor").focus();
            var imgHtml = '<img src="' + imageUrl + '" alt="Hình ảnh bài viết" />';
            execCmd("insertHTML", imgHtml);
        }

        function setHtml(html) {
            document.getElementById("editor").innerHTML = html || "";
        }

        function getHtml() {
            return document.getElementById("editor").innerHTML;
        }

        document.getElementById("editor").addEventListener("input", function() {
            if (window.AndroidBridge && window.AndroidBridge.onContentChanged) {
                window.AndroidBridge.onContentChanged(getHtml());
            }
        });
    </script>
</body>
</html>
