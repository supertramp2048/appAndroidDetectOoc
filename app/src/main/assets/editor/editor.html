<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rich Text Editor</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            color: #17212B;
            background-color: #ffffff;
        }
        #toolbar {
            position: sticky;
            top: -10px;
            z-index: 1000;
            background: #ffffff;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            padding: 8px 0 10px 0;
            border-bottom: 1px solid #D8E0EA;
            margin-bottom: 10px;
        }
        .btn {
            background: #EEF2F6;
            border: 1px solid #D8E0EA;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            color: #17212B;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .btn:active {
            background: #D8E0EA;
        }
        .btn-primary {
            background: #1E5AA8 !important;
            color: #ffffff !important;
            border-color: #1E5AA8 !important;
            font-weight: bold;
        }
        .btn-primary:active {
            background: #16477F !important;
        }
        #editor {
            min-height: 260px;
            outline: none;
            border: 1px solid #D8E0EA;
            border-radius: 4px;
            padding: 12px 14px;
            font-family: Georgia, 'Times New Roman', Cambria, serif;
            font-size: 16px;
            line-height: 1.8;
            color: #17212B;
            background: #ffffff;
        }
        #editor:empty:before {
            content: "Nhập nội dung bài viết chi tiết tại đây...";
            font-style: italic;
            color: #94A3B8;
        }
        img {
            max-width: 100% !important;
            height: auto !important;
            border-radius: 4px;
            border: 1px solid #D8E0EA;
            display: block;
            margin: 12px 0;
        }
        blockquote {
            border-left: 3px solid #1E5AA8;
            margin: 12px 0;
            padding-left: 12px;
            color: #475569;
            font-style: italic;
        }
        pre, code {
            background: #F1F5F9;
            border: 1px solid #E2E8F0;
            padding: 8px;
            border-radius: 4px;
            overflow-x: auto;
            font-family: monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <button class="btn" onclick="execCmd('bold')"><b>B</b></button>
        <button class="btn" onclick="execCmd('italic')"><i>I</i></button>
        <button class="btn" onclick="execCmd('underline')"><u>U</u></button>
        <button class="btn" onclick="execCmd('formatBlock', '<h2>')">H2</button>
        <button class="btn" onclick="execCmd('formatBlock', '<h3>')">H3</button>
        <button class="btn" onclick="execCmd('insertUnorderedList')">• Danh sách</button>
        <button class="btn" onclick="execCmd('formatBlock', '<blockquote>')">” Trích dẫn</button>
        <button class="btn" onclick="insertLink()">🔗 Link</button>
        <button class="btn btn-primary" onclick="triggerImageUpload()">📷 Chèn ảnh</button>
    </div>

    <div id="editor" contenteditable="true"></div>

    <script>
        function execCmd(cmd, value = null) {
            document.execCommand(cmd, false, value);
        }

        function insertLink() {
            var url = prompt("Nhập liên kết (URL):", "https://");
            if (url) {
                execCmd("createLink", url);
            }
        }

        function triggerImageUpload() {
            if (window.AndroidBridge && window.AndroidBridge.pickImage) {
                window.AndroidBridge.pickImage();
            }
        }

        function insertImage(imageUrl) {
            document.getElementById("editor").focus();
            var imgHtml = '<img src="' + imageUrl + '" alt="Hình ảnh bài viết" />';
            execCmd("insertHTML", imgHtml);
        }

        function setHtml(html) {
            document.getElementById("editor").innerHTML = html || "";
        }

        function getHtml() {
            return document.getElementById("editor").innerHTML;
        }

        document.getElementById("editor").addEventListener("input", function() {
            if (window.AndroidBridge && window.AndroidBridge.onContentChanged) {
                window.AndroidBridge.onContentChanged(getHtml());
            }
        });
    </script>
</body>
</html>
